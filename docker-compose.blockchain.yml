services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "2"]
    ports: ["8545:8545"]
  ledger-contract-deployer:
    image: node:22-alpine
    working_dir: /workspace/blockchain
    volumes:
      - .:/workspace
    environment:
      LEDGER_RPC_URL: http://anvil:8545
      # Anvil account 0; local development only. Never reuse this key.
      LEDGER_SIGNER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    command: ["sh", "-c", "corepack enable && npm install && npm run compile && npm run deploy:local"]
    depends_on: [anvil]
