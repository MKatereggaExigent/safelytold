name: safelytold
services:
  postgres-core:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: safelytold
      POSTGRES_PASSWORD: safelytold_dev_only
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: gateway,tenancy,identity,policy,intake,mailbox,case,investigation,evidence,protection,support,analytics,integration,notification,privacy,security_monitor,ai_gateway,platform_api
    volumes:
    - postgres_core_data:/var/lib/postgresql/data
    - ./infrastructure/postgres/create-multiple-databases.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U safelytold -d postgres
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
    - 5432:5432
  postgres-vault:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault_dev_only
      POSTGRES_DB: reporter_identity
    volumes:
    - postgres_vault_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U vault -d reporter_identity
      interval: 5s
      timeout: 5s
      retries: 20
  postgres-audit:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit_dev_only
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: audit,ledger
    volumes:
    - postgres_audit_data:/var/lib/postgresql/data
    - ./infrastructure/postgres/create-multiple-databases.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U audit -d postgres
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit load_definitions "/etc/rabbitmq/definitions.json"
    ports:
    - 5672:5672
    - 15672:15672
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 20
  temporal-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
    - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U temporal -d temporal
      interval: 5s
      timeout: 5s
      retries: 20
  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    depends_on:
      temporal-postgres:
        condition: service_healthy
    ports:
    - 7233:7233
  temporal-ui:
    image: temporalio/ui:2.50.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:9000
    depends_on:
    - temporal
    ports:
    - 8088:8080
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: safelytold
      MINIO_ROOT_PASSWORD: safelytold_dev_only_change_me
    volumes:
    - minio_data:/data
    ports:
    - 9010:9000
    - 9011:9001
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 10s
      timeout: 5s
      retries: 20
  clamav:
    image: clamav/clamav:1.4
    ports:
    - 3310:3310
    healthcheck:
      test:
      - CMD-SHELL
      - echo PING | nc localhost 3310 | grep PONG
      interval: 30s
      timeout: 10s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_only
    volumes:
    - ./infrastructure/keycloak/safelytold-realm.json:/opt/keycloak/data/import/safelytold-realm.json:ro
    - keycloak_data:/opt/keycloak/data
    ports:
    - 8080:8080
  opa:
    image: openpolicyagent/opa:1.6.0-static
    command:
    - run
    - --server
    - --log-level=info
    - /policies/safelytold.rego
    volumes:
    - ./infrastructure/opa:/policies:ro
    ports:
    - 8181:8181
  prefect-server:
    image: prefecthq/prefect:3.7-python3.12
    profiles:
    - ai
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_URL: http://0.0.0.0:4200/api
    volumes:
    - prefect_data:/root/.prefect
    ports:
    - 4200:4200
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.python
      args:
        APP_MODULE: services.api_gateway.app.main:app
    environment:
      SERVICE_NAME: api_gateway
      PORT: '9085'
      DATABASE_URL: postgresql+asyncpg://safelytold:safelytold_dev_only@postgres-core:5432/gateway
      RABBITMQ_URL: amqp://safelytold:safelytold_dev_only@rabbitmq:5672/%2F
      DEV_AUTH_BYPASS: 'true'
      JWT_ISSUER: http://keycloak:8080/realms/safelytold
      JWT_AUDIENCE: safelytold-api
      TEMPORAL_ADDRESS: temporal:7233
      S3_ENDPOINT_URL: http://minio:9000
      OPA_URL: http://opa:8181/v1/data/safelytold/authz/decision
      CORS_ORIGINS: http://localhost:9000,http://127.0.0.1:9000
    depends_on: &id001
      postgres-core:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    ports:
    - 9085:9085
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
  platform-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.python
      args:
        APP_MODULE: services.api.app.main:app
    environment:
      HELP_ME_DATABASE_URL: postgresql+asyncpg://safelytold:safelytold_dev_only@postgres-core:5432/platform_api
      HELP_ME_ENVIRONMENT: development
    depends_on:
      postgres-core:
        condition: service_healthy
    ports:
