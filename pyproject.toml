[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "safelytold-foundation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.139.2,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=45,<47",
  "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.38,<2",
  "opentelemetry-api>=1.33,<2",
  "opentelemetry-sdk>=1.33,<2",
  "opentelemetry-exporter-otlp>=1.33,<2",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
messaging = ["aio-pika>=9.5,<10"]
workflow = ["temporalio>=1.15,<2"]
ai = ["prefect>=3.7,<4"]
blockchain = ["web3>=7.16.0,<8"]
workers = [
  "aio-pika>=9.5,<10",
  "temporalio>=1.15,<2",
  "prefect>=3.7,<4",
]
all = [
  "aio-pika>=9.5,<10",
  "temporalio>=1.15,<2",
  "prefect>=3.7,<4",
  "web3>=7.16.0,<8",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-PyYAML>=6,<7",
]

[tool.setuptools]
package-dir = {"" = "packages/python/safelytold_common"}

[tool.setuptools.packages.find]
where = ["packages/python/safelytold_common"]
include = ["safelytold_common*"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/python/safelytold_common"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["blockchain/node_modules", "apps/*/.next"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]
