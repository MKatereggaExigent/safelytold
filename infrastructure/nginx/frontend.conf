# Frontend entry point for safelytold.
# Serves the three Next.js applications behind one port (9000):
#   /        -> reporter portal   (reporter-web, port 3000)
#   /staff/  -> staff operations (staff-web, port 3001, basePath /staff)
#   /trust/  -> public trust centre (trust-center-web, port 3002, basePath /trust)
# The single backend entry point is exposed separately on port 9085 (api-gateway).

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;
    set $upstream_reporter http://reporter-web:3000;
    set $upstream_staff http://staff-web:3001;
    set $upstream_trust http://trust-center-web:3002;

    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /staff {
        proxy_pass $upstream_staff;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /trust {
        # Trust centre is part of the reporter app so that / <-> /trust
        # navigation is client-side (no full page reload / blink).
        proxy_pass $upstream_reporter;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass $upstream_reporter;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
